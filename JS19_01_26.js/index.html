<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 20px;
            justify-items: center;
    
        }

        #myform {
            padding: 20px;
            width: 500px;
            height: 600px;
            border: 1px solid black;
            border-radius: 10px;
        }

        input,button {
            padding: 8px;
            width: 100%;
            border-radius: 10px;
        }

        .gen input {
            width: auto;
            margin-right: 10px;
        }

        select {
            width: 50%;
            padding: 8px;
        }

        textarea {
            width: 100%;
            height: 100px;
            border-radius: 10px;
        }
        #submitBtn{
            width: 50%;
            margin-left: 120px;
            margin-top: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h2>Student Registration Form</h2>


    <form id="myform">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter Name" required>
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter Password" required>
        <label>Email:</label>
        <input type="email" id="email" placeholder="Enter the Email" required>
        <label>Date of Birth: </label>
        <input type="date" id="date" placeholder="Enter the DOB" required>

        <label>Gender:</label><br><br>
        <div class="gen">
            <input type="radio" id="male" value="Male"><label for="male">Male</label> 
            <input type="radio" id="female" value="Female"><label for="female">Female</label> 
            <input type="radio" id="other" value="Other"> <label for="other">Other</label>
        </div><br>

        <label for="interest">Area of Interest:</label><br><br>
        <div class="gen" >
            <input type="checkbox" name="interest"><label>Python</label>
            <input type="checkbox" name="interest"><label>JavaScript</label>
            <input type="checkbox" name="interest"><label>C++</label>
            <input type="checkbox" name="interest"><label>Java</label>
        </div><br>

        <label>State:</label><br>
        <select id="state">
            <option>Tamil Nadu</option>
            <option>Kerala</option>
            <option>Karnataka</option>
        </select><br><br>

        <label>Feedback:</label><br>
        <textarea id="textarea" placeholder="Give the Feedback here...."></textarea>

        <button type="submit" id="submitBtn">Submit</button>
    </form>

</body>


</html>
