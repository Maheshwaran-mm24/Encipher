<!DOCTYPE html>
<html lang="en">
<head>
  <title>Student Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
      justify-items: center;
    }

    #myform {
      padding: 20px;
      width: 500px;
      border: 1px solid black;
      border-radius: 10px;
      background: white;
    }

    input, button {
      padding: 8px;
      width: 100%;
      border-radius: 10px;
      margin-top: 5px;
    }

    .gen input {
      width: auto;
      margin-right: 10px;
    }

    select {
      width: 50%;
      padding: 8px;
    }

    textarea {
      width: 100%;
      height: 100px;
      border-radius: 10px;
    }

    #submitBtn {
      width: 50%;
      margin-left: 120px;
      margin-top: 8px;
    }

    table {
      margin-top: 30px;
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      border: 1px solid #aaa;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #333;
      color: white;
    }

    .action-btn {
      padding: 5px 10px;
      margin: 2px;
      width: auto;
      cursor: pointer;
    }

    .error {
      color: red;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <h2>Student Registration Form</h2>

  <form id="myform">
    <label>Name:</label>
    <input type="text" id="name" required>
    <small class="error" id="nameError"></small>

    <label>Password:</label>
    <input type="password" id="password" required>
    <small class="error" id="passwordError"></small>

    <label>Email:</label>
    <input type="email" id="email" required>
    <small class="error" id="emailError"></small>

    <label>Date of Birth:</label>
    <input type="date" id="date" required>

    <label>Gender:</label><br><br>
    <div class="gen">
      <input type="radio" name="gender" value="Male" required> Male
      <input type="radio" name="gender" value="Female"> Female
      <input type="radio" name="gender" value="Other"> Other
    </div><br>

    <label>Area of Interest:</label><br><br>
    <div class="gen">
      <input type="checkbox" class="interest" value="Python"> Python
      <input type="checkbox" class="interest" value="JavaScript"> JavaScript
      <input type="checkbox" class="interest" value="C++"> C++
      <input type="checkbox" class="interest" value="Java"> Java
    </div><br>

    <label>State:</label><br>
    <select id="state" required>
      <option value="">Select State</option>
      <option>Tamil Nadu</option>
      <option>Kerala</option>
      <option>Karnataka</option>
    </select><br><br>

    <label >Feedback:</label><br>
    <textarea id="textarea" required></textarea>

    <button type="submit" id="submitBtn">Submit</button>
  </form>
 

</body>
</html>
