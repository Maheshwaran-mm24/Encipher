<!DOCTYPE html>
<html lang="en">
<head>
  <title>Student Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
      justify-items: center;
    }
    #myform {
      padding: 20px;
      width: 500px;
      border: 1px solid black;
      border-radius: 10px;
      background: white;
    }
    input, button {
      padding: 8px;
      width: 100%;
      border-radius: 10px;
      margin-top: 5px;
    }
    .gen input {
      width: auto;
      margin-right: 10px;
    }
    select {
      width: 50%;
      padding: 8px;
    }
    textarea {
      width: 100%;
      height: 100px;
      border-radius: 10px;
    }
    #submitBtn {
      width: 50%;
      margin-left: 120px;
      margin-top: 8px;
      background-color: aqua;
    }
    table {
      margin-top: 30px;
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    th, td {
      border: 2px solid #181010;
      padding: 10px;
      text-align: center;
    }
    th {
      background: #427884;
      color: white;
    }
    .action-btn {
      padding: 5px 10px;
      margin: 2px;
      width: auto;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h2>Student Registration Form</h2>

  <form id="myform">
    <label>Name:</label>
    <input type="text" id="name" required>

    <label>Password:</label>
    <input type="password" id="password" required>

    <label>Email:</label>
    <input type="email" id="email" required>

    <label>Date of Birth:</label>
    <input type="date" id="date" required>

    <label>Gender:</label><br><br>
    <div class="gen">
      <input type="radio" name="gender" value="Male"> Male
      <input type="radio" name="gender" value="Female"> Female
      <input type="radio" name="gender" value="Other"> Other
    </div><br>

    <label>Area of Interest:</label><br><br>
    <div class="gen">
      <input type="checkbox" class="interest" value="Python"> Python
      <input type="checkbox" class="interest" value="JavaScript"> JavaScript
      <input type="checkbox" class="interest" value="C++"> C++
      <input type="checkbox" class="interest" value="Java"> Java
    </div><br>

    <label>State:</label><br>
    <select id="state" required>
      <option value="">Select State</option>
      <option>Tamil Nadu</option>
      <option>Kerala</option>
      <option>Karnataka</option>
    </select><br><br>

    <label>Feedback:</label><br>
    <textarea id="textarea" required></textarea>

    <button type="submit" id="submitBtn">Submit</button>
  </form>

  <table id="dataTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Password</th>
        <th>Email</th>
        <th>DOB</th>
        <th>Gender</th>
        <th>Interest</th>
        <th>State</th>
        <th>Feedback</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

<script>
  const form = document.getElementById("myform");
  const tableBody = document.querySelector("#dataTable tbody");
  const submitBtn = document.getElementById("submitBtn");

  let editIndex = null;
  window.onload = loadTable;

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const password = document.getElementById("password").value;
    const email = document.getElementById("email").value.trim();
    const date = document.getElementById("date").value;
    const genderEl = document.querySelector('input[name="gender"]:checked');
    const state = document.getElementById("state").value;
    const feedback = document.getElementById("textarea").value;

    const interests = [];
    document.querySelectorAll(".interest:checked").forEach(item => {
      interests.push(item.value);
    });

    const namePattern = /^[A-Za-z]+$/;
    const passwordPattern = /^\S{8,}$/;
    const gmailPattern = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;

    if (!namePattern.test(name)) {
      alert("Name should contain only alphabets.");
      return;
    }
    if (!passwordPattern.test(password)) {
      alert("Password must be at least 8 characters and contain no spaces.");
      return;
    }
    if (!gmailPattern.test(email)) {
      alert("Please enter a valid Gmail address (example@gmail.com).");
      return;
    }
    if (!genderEl) {
      alert("Please select gender");
      return;
    }
    if (interests.length === 0) {
      alert("Please select at least one interest");
      return;
    }

    const studentData = {
      name,
      password,
      email,
      date,
      gender: genderEl.value,
      interests,
      state,
      feedback
    };

    let allData = JSON.parse(localStorage.getItem("students")) || [];

    if (editIndex === null) {
      allData.push(studentData);
    } else {
      allData[editIndex] = studentData;
      editIndex = null;
      submitBtn.innerText = "Submit";
    }

    localStorage.setItem("students", JSON.stringify(allData));
    form.reset();
    loadTable();
  });

  function loadTable() {
    const allData = JSON.parse(localStorage.getItem("students")) || [];
    tableBody.innerHTML = "";

    allData.forEach((item, index) => {
      if (!item) return;

      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${item.name}</td>
        <td>${item.password}</td>
        <td>${item.email}</td>
        <td>${item.date}</td>
        <td>${item.gender}</td>
        <td>${item.interests.join(", ")}</td>
        <td>${item.state}</td>
        <td>${item.feedback}</td>
        <td>
          <button class="action-btn" onclick="editData(${index})">Edit</button>
          <button class="action-btn" onclick="deleteData(${index})">Delete</button>
        </td>
      `;
      tableBody.appendChild(row);
    });
  }

  function editData(index) {
    const allData = JSON.parse(localStorage.getItem("students"));
    const data = allData[index];

    document.getElementById("name").value = data.name;
    document.getElementById("password").value = data.password;
    document.getElementById("email").value = data.email;
    document.getElementById("date").value = data.date;
    document.getElementById("state").value = data.state;
    document.getElementById("textarea").value = data.feedback;

    document.querySelector(`input[name="gender"][value="${data.gender}"]`).checked = true;

    document.querySelectorAll(".interest").forEach(item => {
      item.checked = data.interests.includes(item.value);
    });

    editIndex = index;
    submitBtn.innerText = "Update";
  }
  function deleteData(index) {
    let allData = JSON.parse(localStorage.getItem("students"));
    allData.splice(index, 1);
    localStorage.setItem("students", JSON.stringify(allData));
    loadTable();
  }
</script>
</body>
</html>
